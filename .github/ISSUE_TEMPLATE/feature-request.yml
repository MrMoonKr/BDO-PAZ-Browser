name: Feature request
description: Suggest an improvement to the browser, CLI or export. For a new file format, use the File format template.
labels:
  - "type: enhancement ✨"
  - "status: new 👀"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you've considered.
    validations:
      required: false
